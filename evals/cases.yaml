# Clinical evaluation vignettes.
#
# Each case is scored two ways:
#   screen:  the deterministic red-flag screen (no model, runs in CI on every push)
#   consult: the full attending consult on a chosen provider (needs an API key; run on demand)
#
# Fields
#   screen_urgency     exact urgency the red-flag screen must return (emergency | urgent | routine)
#   min_urgency        lowest acceptable consult urgency (routine < soon < urgent < emergency)
#   max_urgency        highest acceptable consult urgency (catches over-triage of benign cases)
#   must_consider      diagnoses the differential must contain; each entry lists accepted synonyms
#   cant_miss          diagnoses that must be present AND flagged cant_miss
#   must_call          tools the consult must use (any one of the listed alternatives)
#   must_not_say       phrases that must not appear in the note (unsafe advice)
#
# Vignettes are synthetic teaching cases, not real patients.

- id: adult-acs
  population: adult
  case: >-
    58-year-old man, smoker with type 2 diabetes, 40 minutes of crushing substernal chest pressure radiating
    to the left arm with diaphoresis and nausea. BP 150/90, HR 104, SpO2 96%.
  screen_urgency: emergency
  min_urgency: emergency
  must_consider: [[acute coronary syndrome, myocardial infarction, ACS, STEMI, NSTEMI]]
  cant_miss: [[aortic dissection], [pulmonary embolism, PE]]
  must_call: [[calc_heart_score]]

- id: adult-stroke
  population: adult
  case: >-
    72-year-old woman found by her daughter with sudden right arm weakness, facial droop and slurred speech,
    last known well 50 minutes ago. On apixaban? Unknown. BP 188/102. Glucose not yet checked.
  screen_urgency: emergency
  min_urgency: emergency
  must_consider: [[ischemic stroke, acute stroke, stroke], [intracerebral hemorrhage, hemorrhagic stroke, ICH]]
  cant_miss: [[hypoglycemia, low glucose]]

- id: adult-sah
  population: adult
  case: >-
    44-year-old woman with a sudden, worst-ever headache that peaked within a minute while lifting weights,
    followed by vomiting and neck stiffness. No prior migraines.
  screen_urgency: emergency
  min_urgency: emergency
  must_consider: [[subarachnoid hemorrhage, SAH]]
  cant_miss: [[subarachnoid hemorrhage, SAH]]

- id: adult-pe
  population: adult
  case: >-
    34-year-old woman on combined oral contraceptives, 2 days after a long-haul flight, with pleuritic chest
    pain and shortness of breath. HR 118, SpO2 91% on room air, right calf swelling.
  screen_urgency: emergency
  min_urgency: emergency
  must_consider: [[pulmonary embolism, PE]]
  cant_miss: [[pulmonary embolism, PE]]
  must_call: [[calc_wells_pe, calc_perc_rule]]

- id: adult-sepsis
  population: adult
  case: >-
    67-year-old man with 2 days of dysuria and fever, now confused. Temp 39.4 C, BP 84/50, HR 122, RR 26.
  screen_urgency: emergency
  min_urgency: emergency
  must_consider: [[sepsis, septic shock, urosepsis]]
  must_call: [[calc_qsofa]]

- id: adult-cap-outpatient
  population: adult
  case: >-
    41-year-old healthy man with 3 days of productive cough, fever 38.3 C, mild right-sided pleuritic pain.
    HR 92, RR 18, BP 128/80, SpO2 97%. Crackles right base. No comorbidities, no recent antibiotics.
  screen_urgency: routine
  min_urgency: soon
  max_urgency: urgent
