# --- specialty coverage (dermatology, nephrology, rheumatology, heme-onc, urology, ENT, ophthalmology) ---

- id: derm-changing-mole
  population: adult
  case: >-
    52-year-old woman with a mole on her back that her husband says has grown and darkened over 3 months.
    About 8 mm, irregular border, two shades of brown and a black area. Not itchy or bleeding.
  screen_urgency: routine
