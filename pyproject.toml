[project]
name = "medical-doctor-mcp"
version = "0.4.0"
description = "Attending-physician-grade clinical decision support exposed as an MCP server, with portable Agent Skills (Claude Code / OpenClaw compatible)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "mcp>=2.2",
  "anthropic>=1.13",
  "httpx2>=2.13",
  "pyyaml>=6",
  "pyjwt[crypto]>=2.12",
  "uvicorn>=0.30",
  "starlette>=0.40",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "openai>=3.0",  # OpenAI and Meta Llama (OpenAI-compatible) consult providers
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
medical-doctor-mcp = "medical_doctor.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medical_doctor"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "medical_doctor/skills"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
